name: Release

on:
  push:
    tags:
      - v1.0.4

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish NuGet release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      oracle:
        image: gvenzl/oracle-free@sha256:d8913e4e4769b6e60197949bef30a4391713afe662b4b4e71a2665c881bdac8b
        env:
          ORACLE_PASSWORD: OracleAdmin123
          APP_USER: hangfire
          APP_USER_PASSWORD: HangfireTest123
        ports:
          - 1521:1521
        options: >-
          --health-cmd /opt/oracle/healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      CI: true
      ORACLE_TEST_CONNECTION_STRING: User Id=hangfire;Password=HangfireTest123;Data Source=localhost:1521/FREEPDB1
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Validate tag and project version
        shell: pwsh
        run: ./eng/Assert-ReleaseVersion.ps1 -Tag '${{ github.ref_name }}'
      - name: Restore locked dependencies and audit
        run: dotnet restore Hangfire.Oracle.sln --locked-mode
      - name: Verify formatting
        run: dotnet format Hangfire.Oracle.sln --verify-no-changes --no-restore
      - name: Build with warnings as errors
        run: dotnet build Hangfire.Oracle.sln --configuration Release --no-restore
      - name: Test .NET 8 with Oracle
        run: >-
          dotnet run --project tests/Hangfire.Oracle.Core.Tests
          --configuration Release --framework net8.0 --no-build --
          --minimum-expected-tests 40 --progress off --output Normal
      - name: Test .NET 10 with Oracle and collect coverage
        run: >-
          dotnet run --project tests/Hangfire.Oracle.Core.Tests
          --configuration Release --framework net10.0 --no-build --
          --minimum-expected-tests 40 --progress off --output Normal
          --coverage --coverage-output-format cobertura
          --coverage-output coverage.net10.xml
          --results-directory artifacts/coverage
      - name: Enforce coverage thresholds
        shell: pwsh
        run: ./eng/Verify-Coverage.ps1 -Path artifacts/coverage/coverage.net10.xml
      - name: Report dependency state
        run: |
          dotnet list Hangfire.Oracle.sln package --deprecated --include-transitive --no-restore
          dotnet list Hangfire.Oracle.sln package --vulnerable --include-transitive --no-restore
      - name: Pack tagged version
        run: >-
          dotnet pack src/Hangfire.Oracle.Core/Hangfire.Oracle.Core.csproj
          --configuration Release --no-build --no-restore
          --output artifacts/package
          -p:RepositoryCommit=${GITHUB_SHA}
      - name: Inspect package contents
        shell: pwsh
        run: ./eng/Verify-Package.ps1 -ArtifactsPath artifacts/package
      - name: Smoke-install local package
        shell: pwsh
        run: ./eng/Test-PackageInstall.ps1 -ArtifactsPath artifacts/package
      - name: Publish package and symbols to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: ./eng/Publish-NuGet.ps1 -ArtifactsPath artifacts/package -ApiKey $env:NUGET_API_KEY
      - name: Create GitHub release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          name: DevDad.Hangfire.Oracle 1.0.4
          body_path: release-notes/1.0.4.md
          files: |
            artifacts/package/DevDad.Hangfire.Oracle.1.0.4.nupkg
            artifacts/package/DevDad.Hangfire.Oracle.1.0.4.snupkg
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
      - name: Upload immutable release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DevDad.Hangfire.Oracle-1.0.4
          path: |
            artifacts/package/DevDad.Hangfire.Oracle.1.0.4.nupkg
            artifacts/package/DevDad.Hangfire.Oracle.1.0.4.snupkg
            artifacts/coverage/coverage.net10.xml
          if-no-files-found: error
          retention-days: 90
